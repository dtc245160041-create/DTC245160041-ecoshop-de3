server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: ecoshop-nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          site: ecoshop
          log_type: access
          __path__: /var/log/ecoshop/access.log
      - targets: [localhost]
        labels:
          job: nginx
          site: ecoshop
          log_type: error
          __path__: /var/log/ecoshop/error.log

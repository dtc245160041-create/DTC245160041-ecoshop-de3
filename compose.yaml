# DE 3: Lab Compose CO LAP. Khong mount volume dang chay cua EcoShop cu.
# Khoi dong o cong 18080/13000, giu nguyen 80/3000/8080 cua he thong cu.
name: ecoshopde3
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wpuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Please_run_scripts/init-env.sh}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Please_run_scripts/init-env.sh}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Please_run_scripts/init-env.sh}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 35s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    logging: {options: {max-size: "10m", max-file: "3"}}

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on: {mysql: {condition: service_healthy}}
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wpuser}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Please_run_scripts/init-env.sh}
      WORDPRESS_CONFIG_EXTRA: |
        if (!empty($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('DISALLOW_FILE_EDIT', true);
    volumes: ["wp_data:/var/www/html"]
    networks: [frontend, database]
    security_opt: ["no-new-privileges:true"]
    logging: {options: {max-size: "10m", max-file: "3"}}

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on: {mysql: {condition: service_healthy}}
    environment: {PMA_HOST: mysql, PMA_PORT: "3306", UPLOAD_LIMIT: "32M"}
    ports: ["${LAB_BIND_IP:-127.0.0.1}:${LAB_PMA_PORT:-18081}:80"]
    networks: [database, frontend]
    security_opt: ["no-new-privileges:true"]
    logging: {options: {max-size: "10m", max-file: "3"}}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [wordpress]
    ports: ["${LAB_HTTP_PORT:-18080}:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/shared-logs
    networks: [frontend, monitoring]
    security_opt: ["no-new-privileges:true"]
    logging: {options: {max-size: "10m", max-file: "3"}}

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8080/stub_status"]
    depends_on: [nginx]
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]
    # read-only host mounts; only deploy on trusted VM

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped
    depends_on: {mysql: {condition: service_healthy}}
    command: ["--mysqld.address=mysql:3306", "--mysqld.username=exporter"]
    environment: {MYSQLD_EXPORTER_PASSWORD: "${MYSQL_EXPORTER_PASSWORD:?Please_run_scripts/init-env.sh}"}
    networks: [database, monitoring]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=2d", "--storage.tsdb.retention.size=200MB"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["${LAB_BIND_IP:-127.0.0.1}:${LAB_PROMETHEUS_PORT:-19090}:9090"]
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging: {options: {max-size: "10m", max-file: "3"}}

  loki-init:
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /loki && chown -R 10001:10001 /loki"]
    volumes: ["loki_data:/loki"]
    restart: "no"
  loki:
    image: grafana/loki:3.5.1
    user: "10001:10001"
    restart: unless-stopped
    depends_on: {loki-init: {condition: service_completed_successfully}}
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  promtail-init:
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /tmp/positions && chown -R 10001:10001 /tmp/positions"]
    volumes: ["promtail_positions:/tmp/positions"]
    restart: "no"

  promtail:
    user: "10001:10001"
    # Legacy agent required by class rubric; EOL 2026-03-02. Avoid for production.
    image: grafana/promtail:3.5.1
    restart: unless-stopped
    depends_on:
      loki: {condition: service_started}
      nginx: {condition: service_started}
      promtail-init: {condition: service_completed_successfully}
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/ecoshop:ro
      - promtail_positions:/tmp/positions
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  grafana:
    image: grafana/grafana:13.2.4
    user: "472:472"
    restart: unless-stopped
    depends_on: [prometheus, loki]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-ecoshopadmin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Please_run_scripts/init-env.sh}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-smtp.gmail.com:587}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports: ["${LAB_BIND_IP:-127.0.0.1}:${LAB_GRAFANA_PORT:-13000}:3000"]
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging: {options: {max-size: "10m", max-file: "3"}}

networks:
  frontend: {}
  database: {internal: true}
  monitoring: {}
volumes:
  mysql_data: {name: de3_mysql_data}
  wp_data: {name: de3_wp_data}
  nginx_logs: {name: de3_nginx_logs}
  prometheus_data: {name: de3_prometheus_data}
  grafana_data: {name: de3_grafana_data}
  loki_data: {name: de3_loki_data}
  promtail_positions: {name: de3_promtail_positions}

name: Validate EcoShop Compose
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  static-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create dummy secret values for static config validation
        run: |
          cp .env.example .env
          sed -i 's/=GENERATE_BEFORE_DEPLOY/=CI_TEST_VALUE_ONLY/g' .env
          chmod 600 .env
      - name: Validate Docker Compose interpolation
        run: docker compose config -q
      - name: Verify isolation and required services
        run: python3 scripts/verify-config.py
      - name: Shell syntax
        run: |
          for f in scripts/*.sh db/init/*.sh; do bash -n "$f"; done
      - name: Verify JSON dashboard
        run: python3 -m json.tool grafana/dashboards/ecoshop-de3.json >/dev/null
      - name: Validate EcoShop demo PHP syntax
        run: |
          command -v php >/dev/null || (sudo apt-get update && sudo apt-get install -y php-cli)
          for f in site/ecoshop-studio/*.php site/ecoshop-studio/inc/*.php scripts/apply-demo-site.php scripts/enable-demo-commerce.php scripts/check-demo-commerce.php; do php -l "$f"; done
      - name: Guard demo-only checkout and isolated deployment
        run: |
          grep -q "Thanh toán khi nhận hàng (mô phỏng)" site/ecoshop-studio/inc/cart-checkout.php
          grep -q "REFUSING_NON_LAB_VOLUMES" scripts/install-demo-commerce.sh
          grep -q "MYSQL_LAB_BACKUP_OK" scripts/install-demo-commerce.sh
      - name: Validate EcoShop demo JavaScript
        run: node --check site/ecoshop-studio/assets/app.js
      - name: Validate product illustrations as XML
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          assets=list(pathlib.Path('site/ecoshop-studio/assets').glob('*.svg'))
          assert len(assets)==6, 'Expected 6 illustration files'
          for f in assets: ET.parse(f)
          print('ECO_STUDIO_ASSETS_OK',len(assets))
          PY

      - name: Validate final-audit Python syntax (without running on CI host)
        run: python3 -m py_compile scripts/final-audit.py
